[workspace]
members = [
    "crates/anymount",
    "crates/anymount-cli",
    "crates/anymount-tui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
authors = ["esdandreu"]
build = "build.rs"

[workspace.metadata.dylint]
libraries = [
    { path = "tools/lints/no_pub_crate" },
    { path = "tools/lints/no_super_outside_use" },
    { path = "tools/lints/driver_readme" },
    { path = "tools/lints/no_mod_rs" },
    { path = "tools/lints/module_names" },
]
