name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env:
    CARGO_TERM_COLOR: always

jobs:
    linux:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install FUSE and pkg-config
              run: sudo apt-get update && sudo apt-get install -y fuse3 libfuse3-dev pkg-config

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: llvm-tools-preview

            - name: Cache Rust
              uses: Swatinem/rust-cache@v2
              with:
                  key: llvm-cov

            - name: Install cargo-llvm-cov
              run: cargo install cargo-llvm-cov

            - name: Install cargo-nextest
              uses: taiki-e/install-action@nextest

            - name: Run tests (JUnit for analytics)
              run: cargo nextest run --all-features --profile ci

            - name: Run tests with coverage
              run: cargo llvm-cov --all-features --lcov --output-path lcov.info

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v5
              with:
                  files: lcov.info
                  disable_search: true
                  fail_ci_if_error: false

            - name: Upload test results to Codecov
              uses: codecov/codecov-action@v5
              with:
                  report_type: test_results
                  files: target/nextest/ci/junit.xml
                  disable_search: true
                  fail_ci_if_error: false

    windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: llvm-tools-preview

            - name: Cache Rust
              uses: Swatinem/rust-cache@v2
              with:
                  key: llvm-cov

            - name: Check FUSE feature
              run: cargo check -p anymount --features fuse

            - name: Install cargo-llvm-cov
              run: cargo install cargo-llvm-cov

            - name: Install cargo-nextest
              uses: taiki-e/install-action@nextest

            - name: Run tests (JUnit for analytics)
              run: cargo nextest run --all-features --profile ci

            - name: Run tests with coverage
              run: cargo llvm-cov --all-features --lcov --output-path lcov.info

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v5
              with:
                  files: lcov.info
                  disable_search: true
                  fail_ci_if_error: false

            - name: Upload test results to Codecov
              uses: codecov/codecov-action@v5
              with:
                  report_type: test_results
                  files: target/nextest/ci/junit.xml
                  disable_search: true
                  fail_ci_if_error: false

    macos:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install macFUSE and pkg-config
              run: brew install macfuse pkgconf

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: llvm-tools-preview

            - name: Cache Rust
              uses: Swatinem/rust-cache@v2
              with:
                  key: llvm-cov

            - name: Install cargo-llvm-cov
              run: cargo install cargo-llvm-cov

            - name: Install cargo-nextest
              uses: taiki-e/install-action@nextest

            - name: Run tests (JUnit for analytics)
              run: cargo nextest run --all-features --profile ci

            - name: Run tests with coverage
              run: cargo llvm-cov --all-features --lcov --output-path lcov.info

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v5
              with:
                  files: lcov.info
                  disable_search: true
                  fail_ci_if_error: false

            - name: Upload test results to Codecov
              uses: codecov/codecov-action@v5
              with:
                  report_type: test_results
                  files: target/nextest/ci/junit.xml
                  disable_search: true
                  fail_ci_if_error: false
