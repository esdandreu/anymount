["examples:note-editor:test"]
description = "Test the note editor browser driver adapter"
depends = ["examples:note-editor:registry-test"]
run = "node --test examples/note-editor/driver.test.mjs"

["examples:note-editor:registry-test"]
description = "Test shared registries and mounting on WebAssembly"
run = "wasm-pack test --node crates/anymount --lib"

["examples:note-editor:build"]
description = "Build the browser driver WebAssembly package"
run = "wasm-pack build crates/anymount --target web --out-dir ../../examples/note-editor/pkg --out-name anymount_browser --release"

["examples:note-editor:serve"]
description = "Serve the note editor example on localhost"
run = "python3 -m http.server 4173 --directory examples/note-editor"
