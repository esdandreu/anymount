[package]
name = "no_super_outside_use"
version = "0.1.0"
authors = ["esdandreu"]
description = "Dylint lint that requires importing super items in use statements"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dylint_linting = "=6.0.4"

[dev-dependencies]
dylint_testing = "=6.0.4"

[workspace]

[package.metadata.rust-analyzer]
rustc_private = true
