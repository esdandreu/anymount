[package]
name = "no_test_folders"
version = "0.1.0"
authors = ["esdandreu"]
description = "Dylint lint that forbids test directories"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dylint_linting = "=6.0.4"

[dev-dependencies]
tempfile = "3"

[workspace]

[package.metadata.rust-analyzer]
rustc_private = true
