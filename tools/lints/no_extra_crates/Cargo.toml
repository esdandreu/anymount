[package]
name = "no_extra_crates"
version = "0.1.0"
authors = ["esdandreu"]
description = "Dylint lint that prohibits new crates except anymount, anymount-cli and anymount-tui"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dylint_linting = "=6.0.4"

[dev-dependencies]
tempfile = "=3.27.0"

[workspace]

[package.metadata.rust-analyzer]
rustc_private = true
