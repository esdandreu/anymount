<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AnyMount browser workspace</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      body {
        box-sizing: border-box;
        margin: 0 auto;
        max-width: 48rem;
        padding: 3rem 1.25rem;
      }
      h1 {
        margin-bottom: 0.5rem;
      }
      p {
        line-height: 1.5;
      }
      #status {
        min-height: 1.5em;
      }
      textarea {
        box-sizing: border-box;
        display: block;
        font: inherit;
        margin: 1rem 0;
        min-height: 16rem;
        padding: 0.75rem;
        resize: vertical;
        width: 100%;
      }
      button {
        font: inherit;
        margin: 0 0.5rem 0.5rem 0;
        padding: 0.55rem 0.85rem;
      }
      .note {
        border-inline-start: 0.2rem solid currentColor;
        padding-inline-start: 0.8rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AnyMount browser workspace</h1>
      <p class="note">
        This static app stores a note in a directory you select. The browser
        asks for access, and you can revoke it in browser settings.
      </p>
      <p id="status" role="status" aria-live="polite">Checking browser support…</p>
      <button id="workspace" type="button">Choose workspace</button>
      <button id="reconnect" type="button" hidden>Reconnect workspace</button>
      <button id="load" type="button" disabled>Reload note</button>
      <button id="save" type="button" disabled>Save note</button>
      <label for="content">anymount-note.txt</label>
      <textarea id="content" spellcheck="false"></textarea>
    </main>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
